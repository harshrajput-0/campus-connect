<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">

    <title>Gallery Page</title>
</head>

<body>
    <section id="contact">
        <div class="left">

            <h2>CONTACT US</h2>
            <p class="sub-title">Pick a date, time and party size. We confirm by phone within the hour. Tables
                are held for 15 minutes.</p>

            <div class="info" id="contact">
                <p><strong>Our Address</strong>14, Qaiserbagh Road, Lucknow, UP</p>
                <p><strong>Phone no.</strong>0522 400 0000</p>
                <p><strong>Working Hours</strong>Daily, 12 pm – 11 pm</p>
                <p><strong>Email Address
                    </strong>hello@stackhouse.example</p>
            </div>
        </div>

        <div class="right">
            <form action="">
                <label>Your Name <input type="text" placeholder="Name" required></label>
                <label>Your Email <input type="email" placeholder="Name" required></label>
                <label>Your Phone <input type="tel" placeholder="Name" required></label>
                <label>Message <textarea placeholder="Your message..."></textarea></label>
                <button class="btn btn--primary">Send Message</button>
            </form>
        </div>
    </section>
</body>

</html>
