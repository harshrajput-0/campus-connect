          </svg>

        <nav id="menu" class="nav__links" aria-label="Main">
          <a href="index.html">Home</a>

          <a href="dashboard.html" class="btn btn--ghost">Dashboard</a>
          <a href="register.html" class="btn btn--primary">Register</a>

        <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false"
          aria-controls="menu"><span></span><span></span><span></span></button>
      </div>
    </header>

    <main class="registration-container">
        <h2>Event Registration</h2>

        <p class="subtitle">Fill in your details to get started.</p>

<p id="formMessage" class="form-message" hidden></p>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="studentName"
                    placeholder="Enter your full name"
                    required
                    minlength="5"
                >
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Your Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    pattern="[6-9][0-9]{9}"
                    required
                >
                </div>

                <div class="form-group">
                <label for="eventId">Select Event Category</label>
                <select id="eventId" name="eventId" required>
                <option value="">-- Loading events --</option>
    </select>
</div>

            <button type="submit" id="submitButton">Submit Registration</button>
        </form>
    </main>

      <div class="wrap footer__row">
        <div><a href="index.html" class="logo logo--sm"><span>Crest<b>wood</b></span></a>
